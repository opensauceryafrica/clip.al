packages:
  - 'apps/*'
  - 'packages/*'

# Single source of truth for shared dependency versions.
# Packages reference these with "catalog:" instead of pinning their own.
catalog:
  # Language / tooling
  typescript: ^5.7.3
  tsx: ^4.19.2
  '@types/node': ^22.10.5

  # Next / React
  next: ^15.1.4
  react: ^19.0.0
  react-dom: ^19.0.0
  '@types/react': ^19.0.4
  '@types/react-dom': ^19.0.2

  # Observability
  '@sentry/node': ^8.47.0

  # Data layer
  drizzle-orm: ^0.38.3
  drizzle-kit: ^0.30.1
  postgres: ^3.4.5
  ioredis: ^5.4.2
  '@clickhouse/client': ^1.10.1

  # Auth / crypto
  jose: ^5.9.6
  '@node-rs/argon2': ^2.0.2
  nanoid: ^5.0.9

  # Validation / utils
  zod: ^3.24.1
  ua-parser-js: ^2.0.0
  maxmind: ^4.3.24
  tldts: ^6.1.71

  # Email
  resend: ^4.0.1
  '@react-email/components': ^0.0.32
  '@react-email/render': ^1.0.4

  # UI
  tailwindcss: ^4.0.0
  '@tailwindcss/postcss': ^4.0.0
  geist: ^1.3.1
  lucide-react: ^0.469.0
  server-only: ^0.0.1
  clsx: ^2.1.1
  tailwind-merge: ^2.6.0
  class-variance-authority: ^0.7.1
  '@radix-ui/react-dialog': ^1.1.4
  '@radix-ui/react-dropdown-menu': ^2.1.4
  '@radix-ui/react-tabs': ^1.1.2
  '@radix-ui/react-toast': ^1.2.4
  '@radix-ui/react-slot': ^1.1.1
  '@radix-ui/react-label': ^2.1.1

  # Testing / lint
  vitest: ^2.1.8
  '@playwright/test': ^1.49.1
  eslint: ^9.18.0
  '@eslint/js': ^9.18.0
  typescript-eslint: ^8.19.1
  prettier: ^3.4.2
